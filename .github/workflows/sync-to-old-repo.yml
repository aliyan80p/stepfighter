name: Sync to old repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    if: github.repository != 'aliyan80p/stepfighter-5859cf60'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new Lovable repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Force-push to old repo
        env:
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          if [ -z "$OLD_REPO_TOKEN" ]; then
            echo "OLD_REPO_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote remove old 2>/dev/null || true
          git remote add old "https://x-access-token:${OLD_REPO_TOKEN}@github.com/aliyan80p/stepfighter-5859cf60.git"
          git push old "HEAD:refs/heads/main" --force

      - name: Start live deployment
        env:
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          status=$(curl --silent --show-error --output /tmp/deploy-response.txt --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${OLD_REPO_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aliyan80p/stepfighter-5859cf60/actions/workflows/deploy-cloudflare.yml/dispatches \
            --data '{"ref":"main"}')
          if [ "$status" != "204" ]; then
            echo "Could not start the live deployment (GitHub returned HTTP $status)."
            cat /tmp/deploy-response.txt
            exit 1
          fi
          echo "Live deployment started."
