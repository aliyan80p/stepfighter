name: Deploy to Cloudflare

# Runs ONLY inside the live repo (aliyan80p/stepfighter-5859cf60).
# The Lovable repo pushes here via "Sync to old repo", which then triggers this.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'aliyan80p/stepfighter-5859cf60'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Check required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "Missing repository secret: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          case "$VITE_SUPABASE_URL" in
            *veqealgeqcvmqpujdlgo*) echo "Database address OK." ;;
            *) echo "VITE_SUPABASE_URL points at the wrong database: check the secret."; exit 1 ;;
          esac
          pid=$(printf '%s' "$VITE_SUPABASE_PROJECT_ID" | tr -d '[:space:]')
          case "$pid" in
            *veqealgeqcvmqpujdlgo*) echo "Project id OK." ;;
            *) echo "VITE_SUPABASE_PROJECT_ID points at the wrong database: check the secret."; exit 1 ;;
          esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) echo "Publishable key format OK." ;;
            *) echo "VITE_SUPABASE_PUBLISHABLE_KEY is invalid: check the secret."; exit 1 ;;
          esac

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build:cf

      - name: Verify the build points at the right database
        run: |
          if grep -rq "nqtwatlytdewxodmbuxs" dist/client; then
            echo "Build still contains the test database address. Aborting."
            exit 1
          fi
          if ! grep -rq "veqealgeqcvmqpujdlgo" dist/client; then
            echo "Build does not contain the managed database address. Aborting."
            exit 1
          fi
          echo "Build verified."

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
