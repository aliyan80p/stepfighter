name: Deploy to Cloudflare

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    if: github.repository == 'aliyan80p/stepfighter-5859cf60'
    runs-on: ubuntu-latest
    env:
      # This workflow is exclusive to the independent production repository.
      # Keep its public browser configuration deterministic so stale GitHub
      # values can never point stepfighter.com at the Lovable test database.
      VITE_SUPABASE_URL: https://veqealgeqcvmqpujdlgo.supabase.co
      VITE_SUPABASE_PROJECT_ID: veqealgeqcvmqpujdlgo
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0aAKDWmANScZwVuLGHS6rA_yu9iFpPO
    steps:
      - name: Checkout old repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The app uses Zod 4 while TanStack's legacy adapter still declares a
        # Zod 3-only peer range. The lockfile is already tested with Zod 4, so
        # install that exact dependency tree without npm rejecting the stale range.
        run: npm ci --legacy-peer-deps

      - name: Build for Cloudflare
        # `--mode cfprod` loads the committed .env.cfprod file, so the browser
        # bundle always embeds the independent production database settings
        # even if GitHub secrets are missing or stale.
        run: npx vite build --mode cfprod

      - name: Locate build output
        id: out
        run: |
          config=""
          client=""
          for dir in .output dist; do
            if [ -f "$dir/server/wrangler.json" ]; then
              config="$dir/server/wrangler.json"
              if [ -d "$dir/public" ]; then client="$dir/public"; else client="$dir/client"; fi
              break
            fi
          done
          if [ -z "$config" ]; then
            echo "::error::The build produced no Cloudflare configuration file."
            ls -la . || true
            exit 1
          fi
          echo "Using $config with public files in $client"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"

      - name: Confirm the database address is embedded
        run: |
          if grep -Rqs --fixed-strings "veqealgeqcvmqpujdlgo.supabase.co" "${{ steps.out.outputs.client }}"; then
            echo "Production database address embedded."
          else
            echo "::error::The browser build has no database address. Stopping before replacing the live site."
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --config "${{ steps.out.outputs.config }}" \
            --name stepfighter-5859cf60 \
            --keep-vars \
            --var "SUPABASE_URL:$VITE_SUPABASE_URL" \
            --var "SUPABASE_PROJECT_ID:$VITE_SUPABASE_PROJECT_ID" \
            --var "SUPABASE_PUBLISHABLE_KEY:$VITE_SUPABASE_PUBLISHABLE_KEY"
