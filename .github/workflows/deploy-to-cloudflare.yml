name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'aliyan80p/stepfighter-5859cf60'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout old repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create production .env from secrets
        env:
          # These are publishable (browser-safe) values. Repository secrets
          # override them; the defaults keep a deploy from shipping a build
          # with no backend configured, which breaks the whole site.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://veqealgeqcvmqpujdlgo.supabase.co' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'veqealgeqcvmqpujdlgo' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_0aAKDWmANScZwVuLGHS6rA_yu9iFpPO' }}
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID
          VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY
          EOF
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PROJECT_ID VITE_SUPABASE_PUBLISHABLE_KEY; do
            if ! grep -q "^$v=." .env; then
              echo "::error::$v is empty. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Build for Cloudflare
        # Pass these values directly to Vite as well as writing .env above.
        # This avoids GitHub's step-level environment boundary producing a
        # client bundle with empty database settings.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://veqealgeqcvmqpujdlgo.supabase.co' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'veqealgeqcvmqpujdlgo' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_0aAKDWmANScZwVuLGHS6rA_yu9iFpPO' }}
        run: npm run build:cf

      - name: Verify production database settings were embedded
        run: |
          if ! grep -Rqs 'veqealgeqcvmqpujdlgo.supabase.co' dist/client; then
            echo "::error::The website build is missing its database address. Deployment stopped before replacing the live site."
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
