name: Deploy to Cloudflare

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    if: github.repository == 'aliyan80p/stepfighter-5859cf60'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout old repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The app uses Zod 4 while TanStack's legacy adapter still declares a
        # Zod 3-only peer range. The lockfile is already tested with Zod 4, so
        # install that exact dependency tree without npm rejecting the stale range.
        run: npm ci --legacy-peer-deps

      - name: Prepare production environment variables
        # Use repository secrets when present, otherwise use the known managed-Supabase defaults.
        # Empty secrets are treated the same as missing secrets so the site never deploys blank.
        env:
          SECRET_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SECRET_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          URL="${SECRET_URL:-https://veqealgeqcvmqpujdlgo.supabase.co}"
          PROJECT_ID="${SECRET_PROJECT_ID:-veqealgeqcvmqpujdlgo}"
          PUBLISHABLE_KEY="${SECRET_PUBLISHABLE_KEY:-sb_publishable_0aAKDWmANScZwVuLGHS6rA_yu9iFpPO}"

          if [ -z "$URL" ] || [ -z "$PROJECT_ID" ] || [ -z "$PUBLISHABLE_KEY" ]; then
            echo "::error::One or more Supabase environment variables are empty. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

          cat > .env <<EOF
          VITE_SUPABASE_URL=$URL
          VITE_SUPABASE_PROJECT_ID=$PROJECT_ID
          VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          EOF

      - name: Build for Cloudflare
        run: npm run build:cf

      - name: Verify production database settings were embedded
        run: |
          if ! grep -Rqs 'veqealgeqcvmqpujdlgo.supabase.co' dist/client; then
            echo "::error::The website build is missing its database address. Deployment stopped before replacing the live site."
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
