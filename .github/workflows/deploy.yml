name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build for Cloudflare
        run: bun run build:cf
        env:
          # Own managed backend. The publishable key is safe to commit
          # (row-level security protects the data).
          VITE_SUPABASE_URL: https://veqealgeqcvmqpujdlgo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0aAKDWmANScZwVuLGHS6rA_yu9iFpPO
          VITE_SUPABASE_PROJECT_ID: veqealgeqcvmqpujdlgo

      - name: Verify build output
        run: |
          echo "--- workspace ---"; ls -la
          echo "--- dist ---"; ls -la dist || true
          echo "--- dist/server ---"; ls -la dist/server || true
          echo "--- .output ---"; ls -la .output || true
          echo "--- any index.mjs ---"
          find . -path ./node_modules -prune -o -name 'index.mjs' -print || true
          mkdir -p dist
          if [ ! -f dist/server/index.mjs ] && [ -f .output/server/index.mjs ]; then
            echo "Copying .output/server -> dist/server"
            cp -r .output/server dist/server
          fi
          if [ ! -d dist/client ] && [ -d .output/public ]; then
            echo "Copying .output/public -> dist/client"
            cp -r .output/public dist/client
          fi
          if [ ! -d dist/client ] && [ -d .output/client ]; then
            echo "Copying .output/client -> dist/client"
            cp -r .output/client dist/client
          fi
          echo "--- dist/client ---"; ls -la dist/client || true
          test -d dist/client || { echo "Build did not produce a client folder"; exit 1; }
          test -f dist/server/index.mjs || { echo "Build did not produce dist/server/index.mjs"; exit 1; }

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
